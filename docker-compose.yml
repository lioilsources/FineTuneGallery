# FINETUNE gallery — NAS deployment.
#
#   cp .env.example .env       # set DATA_DIR
#   # place tunnel credentials at cloudflared/credentials.json (not in git)
#   docker compose up -d --build
#
# finetune.ol1n.com runs over the dedicated "finetune-nas" Cloudflare Tunnel
# (cloudflared service below, config in ./cloudflared/) — no host port needed.
# CF Access app "finetune" already exists: Service Auth (app's service token)
# + Allow (owner SSO e-mail).
# LAN fallback: uncomment the ports mapping and point the app's FINETUNE_URL
# at http://<nas-ip>:8092.

services:
  finetune:
    build: .
    image: finetune-gallery:latest
    container_name: finetune-gallery
    restart: unless-stopped
    environment:
      - FINETUNE_ADDR=:8092
      - FINETUNE_DATA=/data
      - TAGGER_URL=http://wd14:8000
    volumes:
      - ${DATA_DIR:-./data}:/data
    # ports:
    #   - "8092:8092"          # LAN access without the tunnel
    networks: [finetune]
    depends_on: [wd14]

  wd14:
    build: ./tagger
    image: finetune-wd14:latest
    container_name: finetune-wd14
    restart: unless-stopped
    environment:
      - TAGGER_THRESHOLD=0.35
    volumes:
      - wd14-cache:/cache
    networks: [finetune]
    # CPU-only; no ports — reachable only from the finetune service.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finetune-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks: [finetune]
    depends_on: [finetune]

volumes:
  wd14-cache:

networks:
  finetune:
